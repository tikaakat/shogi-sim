name: Evolve Shogi Individuals

concurrency:
  group: evolve-shogi
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      generations:
        description: "何世代分進めるか"
        required: false
        default: "3"
      games_vs_yaneuraou:
        description: "1世代あたり、個体ごとのやねうら王との対局数"
        required: false
        default: "1"
      games_vs_peers:
        description: "1世代あたりの個体同士の対局数"
        required: false
        default: "2"

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache YaneuraOu build
        id: cache-yaneuraou
        uses: actions/cache@v4
        with:
          path: /tmp/YaneuraOu
          key: yaneuraou-material-${{ runner.os }}-v1

      - name: Build YaneuraOu (MATERIAL edition)
        run: bash scripts/build_yaneuraou.sh /tmp/YaneuraOu

      - name: Run evolution generation-by-generation (with per-batch deploy)
        timeout-minutes: 340
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_PORT: ${{ secrets.XSERVER_SSH_PORT }}
          XSERVER_TARGET_DIR: ${{ secrets.XSERVER_TARGET_DIR }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
          IMPORT_URL: "https://lab.spia-net.com/shogi2/import_from_colab.php?key=${{ secrets.IMPORT_SECRET_KEY }}"
        run: |
          git config user.name "shogi-sim-bot"
          git config user.email "actions@users.noreply.github.com"

          echo "$XSERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          TOTAL=${{ github.event.inputs.generations }}
          for i in $(seq 1 "$TOTAL"); do
            echo "=== Running generation batch $i / $TOTAL ==="
            python -u run_evolution.py \
              --engine-path /tmp/YaneuraOu/source/YaneuraOu-by-gcc \
              --data-dir data \
              --generations 1 \
              --games-vs-yaneuraou ${{ github.event.inputs.games_vs_yaneuraou }} \
              --games-vs-peers ${{ github.event.inputs.games_vs_peers }}

            git add data/individuals.json data/matches.json data/training_state.json
            if ! git diff --staged --quiet; then
              git commit -m "Evolve: generation batch $i/$TOTAL [skip ci]"
              git pull --rebase origin main
              git push
            fi

            echo "--- Xserverへ反映中（バッチ $i）---"
            scp -i /tmp/deploy_key -P "$XSERVER_PORT" -o StrictHostKeyChecking=no \
              data/individuals.json data/matches.json data/training_state.json \
              "$XSERVER_USER@$XSERVER_HOST:$XSERVER_TARGET_DIR" \
              || echo "::warning::scpでの転送に失敗しました（バッチ $i）。次のバッチへ続行します"

            curl -sS -f "$IMPORT_URL" \
              || echo "::warning::インポートに失敗しました（バッチ $i）。次のバッチへ続行します"
          done

          rm -f /tmp/deploy_key
